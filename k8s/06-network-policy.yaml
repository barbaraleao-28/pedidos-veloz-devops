# ============================================================================
# SEGURANÇA DE REDE (Zero-Trust): Apenas o pedidos-service pode chamar
# internamente os serviços de estoque e pagamentos.
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restringir-acesso-backend
  namespace: pedidos-veloz
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: pedidos-service
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3003
