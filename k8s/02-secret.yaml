# NOTA DE SEGURANÇA (12-Factor App / DevSecOps):
# Em produção real na Loja Veloz, os valores abaixo são injetados via External Secrets Operator
# sincronizados com AWS Secrets Manager / HashiCorp Vault. Este manifesto serve como referência estrutural.
apiVersion: v1
kind: Secret
metadata:
  name: pedidos-veloz-secrets
  namespace: pedidos-veloz
  labels:
    app.kubernetes.io/part-of: loja-veloz-ecommerce
type: Opaque
stringData:
  POSTGRES_USER: "veloz_prod_app"
  POSTGRES_PASSWORD: "REPLACE_IN_CI_VIA_SECRET_MANAGER"
  PAYMENT_PROVIDER_API_KEY: "REPLACE_IN_CI_VIA_SECRET_MANAGER"
