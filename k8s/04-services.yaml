apiVersion: v1
kind: Service
metadata:
  name: estoque-service
  namespace: pedidos-veloz
  labels:
    app: estoque-service
spec:
  type: ClusterIP
  selector:
    app: estoque-service
  ports:
    - name: http
      port: 3003
      targetPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: pagamentos-service
  namespace: pedidos-veloz
  labels:
    app: pagamentos-service
spec:
  type: ClusterIP
  selector:
    app: pagamentos-service
  ports:
    - name: http
      port: 3002
      targetPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: pedidos-service
  namespace: pedidos-veloz
  labels:
    app: pedidos-service
spec:
  type: ClusterIP
  selector:
    app: pedidos-service
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: pedidos-veloz
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: pedidos-veloz
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "150"
spec:
  ingressClassName: nginx
  rules:
    - host: api.lojaveloz.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
